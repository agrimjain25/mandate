services:
  - type: web
    name: mandate
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - {key: PAYPAL_CLIENT_ID, sync: false}
      - {key: PAYPAL_CLIENT_SECRET, sync: false}
      - {key: GROQ_API_KEY, sync: false}
      - {key: CHANNEL3_API_KEY, sync: false}
      - {key: PAYPAL_WEBHOOK_ID, sync: false}
      - {key: BASE_URL, sync: false}   # your https://<name>.onrender.com URL
